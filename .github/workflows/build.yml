name: build-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch installed python-for-android for new pip
        run: |
          # buildozer использует p4a как site-package из venv образа.
          P4A_BASE=$(python3 -c "import sysconfig,sys; print(sysconfig.get_paths()['purelib'] + '/pythonforandroid')")
          echo "p4a at: $P4A_BASE"
          [ -d "$P4A_BASE" ] || { echo "p4a dir missing"; exit 1; }
          FILES=$(grep -rl 'from pip._internal.exceptions import BuildDependencyInstallError' "$P4A_BASE" 2>/dev/null || true)
          echo "files: $FILES"
          for f in $FILES; do
            sudo sed -i \
              's/^from pip._internal.exceptions import BuildDependencyInstallError$/import pip._internal.exceptions as _pie; BuildDependencyInstallError = getattr(_pie, "BuildDependencyInstallError", Exception)/' \
              "$f" || true
          done
          grep -rn 'BuildDependencyInstallError' $FILES 2>/dev/null | head

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error