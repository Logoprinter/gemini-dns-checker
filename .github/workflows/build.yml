name: build-apk
"on":
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint build-essential ccache \
            git libtool libncurses5-dev libssl-dev libtinfo5 \
            python3-venv zlib1g-dev pkg-config wget patch unzip zip \
            libffi-dev libffi8

      - name: Install buildozer with pip<24
        run: |
          python3 -m pip install --upgrade "pip<24"
          python3 -m pip install buildozer

      - name: Pre-clone + patch python-for-android (pinned tag)
        run: |
          P4A_DIR="$PWD/.buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          if [ ! -d "$P4A_DIR/.git" ]; then
            git clone --depth 1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi
          python3 patch_p4a.py "$P4A_DIR"

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error