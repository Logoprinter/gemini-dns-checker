name: build-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Downgrade pip in buildozer venv (p4a compat)
        run: |
          python3 --version
          /home/user/.venv/bin/python3 --version
          # p4a падает с BuildDependencyInstallError на свежем pip (>=25).
          # Понижаем pip в том venv, из которого buildozer запускает p4a.
          /home/user/.venv/bin/python3 -m pip install --upgrade 'pip<24' || true
          /home/user/.venv/bin/python3 -m pip --version
          # то же для системного python, чтобы p4a-venv унаследовал старый pip
          python3 -m pip install --upgrade 'pip<24' || true

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error