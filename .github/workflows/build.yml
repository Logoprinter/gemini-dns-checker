name: build-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-clone and patch python-for-android
        run: |
          P4A_DIR="$PWD/.buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          [ -d "$P4A_DIR/.git" ] || git clone --depth 1 https://github.com/kivy/python-for-android.git "$P4A_DIR"
          echo "p4a at: $P4A_DIR"
          FILES=$(grep -rl 'from pip._internal.exceptions import BuildDependencyInstallError' "$P4A_DIR" 2>/dev/null || true)
          echo "files: $FILES"
          for f in $FILES; do
            sudo sed -i \
              's/^from pip._internal.exceptions import BuildDependencyInstallError$/import pip._internal.exceptions as _pie; BuildDependencyInstallError = getattr(_pie, "BuildDependencyInstallError", Exception)/' \
              "$f" || true
          done
          grep -n 'BuildDependencyInstallError' $FILES 2>/dev/null | head

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error