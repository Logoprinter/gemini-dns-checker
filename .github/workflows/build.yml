name: build-apk
"on":
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint build-essential ccache \
            git libtool libncurses5-dev libssl-dev libtinfo5 \
            python3-venv zlib1g-dev pkg-config wget patch unzip zip \
            libffi-dev libffi8

      - name: Install buildozer with pip<24
        run: |
          python3 -m pip install --upgrade "pip<24"
          python3 -m pip install "Cython==0.29.37" buildozer==1.5.0

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error