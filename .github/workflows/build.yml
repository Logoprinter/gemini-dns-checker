name: build-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:1.4.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          # стабильный образ: тут p4a/pip совместимые; auto-answer root-промпт
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error